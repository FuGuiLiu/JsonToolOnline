      text-transform: uppercase;

      transition: all 200ms ease;
      border: none;
      background: transparent;
      color: var(--text-primary);
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--primary);

    }
    .btn-primary:hover {

    .btn-secondary {

    .tab-btn.active { color: var(--accent); }

      bottom: 0;
      left: 0;

    .tree-string { color: #34d399; }

    const { useState, useCallback, useMemo, useEffect } = React;

        minifySuccess: 'Minified: saved {0} chars ({1}%)',
        escapeSuccess: 'String escaped successfully',
        unescapeSuccess: 'String unescaped successfully',
        diffEmpty: 'No differences — both JSON values are identical.',
        diffError: 'Please enter valid JSON in both fields to compare.',
        placeholder: 'Paste your JSON here...',

        changed: 'Changed',

        length: 'Length',

        lang: '中文',
        features: [
          { title: 'Format & Beautify', desc: 'Pretty-print JSON with configurable indentation' },
          { title: 'Minify', desc: 'Compress JSON by removing whitespace' },
          { title: 'Validate', desc: 'Check syntax with detailed error messages' },
          { title: 'Tree View', desc: 'Explore JSON structure interactively' },

        ],

    };


    // ─── Icons ───
    const icons = {
      copy: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="0" ry="0"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
      check: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      trash: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      download: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
      upload: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
      chevron: <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
      globe: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
    };

    // ─── Utilities ───
    function formatJSON(str, indent = 2) { return JSON.stringify(JSON.parse(str), null, indent); }
    function minifyJSON(str) { return JSON.stringify(JSON.parse(str)); }
    function validateJSON(str) { try { JSON.parse(str); return { valid: true }; } catch (e) { return { valid: false, message: e.message }; } }
    function getJSONStats(str) {
      try {
        const p = JSON.parse(str);
        const s = { type: Array.isArray(p) ? 'Array' : typeof p };
        if (typeof p === 'object' && p !== null) { s.keys = Object.keys(p).length; s.size = new Blob([str]).size; }
        return s;
      } catch { return null; }
    }
    function copyToClipboard(text) {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      else { const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); }
    }

    // ─── TreeNode ───
    function TreeNode({ keyName, value, depth = 0 }) {
      const [expanded, setExpanded] = useState(depth < 2);
      const isObject = value !== null && typeof value === 'object';
      const isArray = Array.isArray(value);
      if (!isObject) {
        let cn = 'tree-null', display = 'null';
        if (typeof value === 'string') { cn = 'tree-string'; display = `"${value}"`; }
        else if (typeof value === 'number') { cn = 'tree-number'; display = String(value); }
        else if (typeof value === 'boolean') { cn = 'tree-boolean'; display = String(value); }
        return <div className="tree-node" style={{ paddingLeft: depth * 20, fontFamily: 'var(--font-mono)' }}>{keyName !== null && <span className="tree-key">{keyName}: </span>}<span className={cn}>{display}</span></div>;
      }
      const entries = isArray ? value.map((v, i) => [i, v]) : Object.entries(value);
      const bracket = isArray ? ['[', ']'] : ['{', '}'];
      return (
        <div style={{ paddingLeft: depth * 20 }}>
          <div className="tree-node" style={{ cursor: 'pointer', userSelect: 'none', display: 'flex', alignItems: 'center', gap: 4, fontFamily: 'var(--font-mono)' }} onClick={() => setExpanded(!expanded)}>
            <span style={{ opacity: 0.4, transition: 'transform 150ms', transform: expanded ? 'rotate(0)' : 'rotate(-90deg)' }}>{icons.chevron}</span>
            {keyName !== null && <span className="tree-key">{keyName}: </span>}
            <span style={{ color: 'var(--text-tertiary)' }}>{bracket[0]} {!expanded && `... ${entries.length} items ${bracket[1]}`}</span>
          </div>
          {expanded && <div>{entries.map(([k, v]) => <TreeNode key={k} keyName={isArray ? k : `"${k}"`} value={v} depth={depth + 1} />)}<div className="tree-node" style={{ paddingLeft: 20, color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)' }}>{bracket[1]}</div></div>}
        </div>
      );
    }


    // ─── JSONDiff ───
    function JSONDiff({ left, right, t }) {
      const diff = useMemo(() => { try { return computeDiff(JSON.parse(left), JSON.parse(right), ''); } catch { return null; } }, [left, right]);
      if (!diff) return <div className="error-msg fade-in">{t.diffError}</div>;
      if (diff.length === 0) return <div className="success-msg fade-in">{t.diffEmpty}</div>;
      return (
        <div className="json-output" style={{ minHeight: 200 }}>
          {diff.map((d, i) => (
            <div key={i} style={{ padding: '6px 12px', marginBottom: 4, fontSize: 12, fontFamily: 'var(--font-mono)', borderLeft: `3px solid ${d.type === 'added' ? '#22c55e' : d.type === 'removed' ? '#ef4444' : '#eab308'}`, background: d.type === 'added' ? 'rgba(34,197,94,0.06)' : d.type === 'removed' ? 'rgba(239,68,68,0.06)' : 'rgba(234,179,8,0.06)' }}>
              <span style={{ opacity: 0.5 }}>{d.path}</span>{' — '}
              <span style={{ fontWeight: 600 }}>
                {d.type === 'added' && `${t.added}: ${JSON.stringify(d.value)}`}
                {d.type === 'removed' && `${t.removed}: ${JSON.stringify(d.value)}`}
                {d.type === 'changed' && `${t.changed}: ${JSON.stringify(d.oldValue)} → ${JSON.stringify(d.newValue)}`}
              </span>
            </div>
          ))}
        </div>
      );
    }
    function computeDiff(left, right, path) {
      const diffs = [];
      if (typeof left !== typeof right || Array.isArray(left) !== Array.isArray(right)) { diffs.push({ path: path || '(root)', type: 'changed', oldValue: left, newValue: right }); return diffs; }
      if (typeof left !== 'object' || left === null) { if (left !== right) diffs.push({ path: path || '(root)', type: 'changed', oldValue: left, newValue: right }); return diffs; }
      const allKeys = new Set([...Object.keys(left), ...Object.keys(right)]);
      for (const key of allKeys) {
        const np = path ? `${path}.${key}` : key;
        if (!(key in left)) diffs.push({ path: np, type: 'added', value: right[key] });
        else if (!(key in right)) diffs.push({ path: np, type: 'removed', value: left[key] });
        else diffs.push(...computeDiff(left[key], right[key], np));
      }
      return diffs;
    }

    // ─── App ───
    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('lang') || 'zh');
      const t = i18n[lang];
      const [activeTab, setActiveTab] = useState('format');
      const [input, setInput] = useState('');
      const [output, setOutput] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [copied, setCopied] = useState(false);
      const [diffLeft, setDiffLeft] = useState('');
      const [diffRight, setDiffRight] = useState('');
      const [indentSize, setIndentSize] = useState(2);

      useEffect(() => { localStorage.setItem('lang', lang); document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; }, [lang]);

      const tabs = [
        { id: 'format', label: t.tabs.format },
        { id: 'minify', label: t.tabs.minify },
        { id: 'validate', label: t.tabs.validate },
        { id: 'tree', label: t.tabs.tree },
        { id: 'diff', label: t.tabs.diff },
        { id: 'escape', label: t.tabs.escape },
      ];

      const clearAll = () => { setInput(''); setOutput(''); setError(''); setSuccess(''); };

      const handleFormat = useCallback(() => { setError(''); setSuccess(''); try { setOutput(formatJSON(input, indentSize)); setSuccess(t.formatSuccess); } catch (e) { setError(e.message); setOutput(''); } }, [input, indentSize, t]);
      const handleMinify = useCallback(() => { setError(''); setSuccess(''); try { const r = minifyJSON(input); setOutput(r); const s = input.length - r.length; setSuccess(t.minifySuccess.replace('{0}', s).replace('{1}', Math.round((s/input.length)*100))); } catch (e) { setError(e.message); setOutput(''); } }, [input, t]);
      const handleValidate = useCallback(() => { setError(''); setSuccess(''); setOutput(''); const r = validateJSON(input); if (r.valid) setSuccess(t.validJson); else setError(r.message); }, [input, t]);
      const handleEscape = useCallback(() => { setError(''); setSuccess(''); try { setOutput(JSON.stringify(input)); setSuccess(t.escapeSuccess); } catch (e) { setError(e.message); setOutput(''); } }, [input, t]);
      const handleUnescape = useCallback(() => { setError(''); setSuccess(''); try { const r = JSON.parse(input); setOutput(typeof r === 'string' ? r : JSON.stringify(r, null, 2)); setSuccess(t.unescapeSuccess); } catch (e) { setError(e.message); setOutput(''); } }, [input, t]);

      const handleCopy = () => { copyToClipboard(output || input); setCopied(true); setTimeout(() => setCopied(false), 2000); };
      const handleDownload = () => { const blob = new Blob([output || input], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'data.json'; a.click(); URL.revokeObjectURL(url); };
      const handleFileUpload = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => setInput(ev.target.result); reader.readAsText(file); };
      const handleSample = () => { setInput(JSON.stringify({ name: "JSON 工具", version: "2.0.0", features: ["format", "minify", "validate", "tree-view", "diff"], author: { name: "开发者", email: "dev@example.com" }, settings: { theme: "editorial", indent: 2 }, tags: [{ id: 1, label: "工具" }, { id: 2, label: "开发者" }], isActive: true, createdAt: "2026-01-01T00:00:00Z" }, null, 2)); };

      const stats = useMemo(() => input ? getJSONStats(input) : null, [input]);


      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Navbar */}
          <nav className="navbar">
            <div style={{ width: '100%', maxWidth: '72rem', padding: '0 40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <div style={{ width: 28, height: 28, background: '#3b82f6', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span style={{ color: '#0a1628', fontWeight: 700, fontSize: 12, fontFamily: 'var(--font-mono)' }}>{'{}'}</span>
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, fontFamily: 'var(--font-grotesk)', letterSpacing: '0.15em', textTransform: 'uppercase', color: 'var(--text-primary)' }}>{t.title}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <button className="btn btn-ghost" onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} style={{ fontSize: 11 }}>
                  {icons.globe} {t.lang}
                </button>
                <a href="https://github.com/FuGuiLiu/JsonToolOnline" target="_blank" rel="noopener" className="btn btn-ghost" style={{ padding: 8 }}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
              </div>
            </div>
          </nav>

          {/* Hero */}
          <section className="hero-gradient" style={{ textAlign: 'center', padding: '72px 40px 56px' }}>
            <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 42, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 12, color: 'var(--primary)' }}>{t.heroTitle}</h1>
            <p style={{ fontSize: 13, fontFamily: 'var(--font-grotesk)', color: 'var(--text-secondary)', maxWidth: 480, margin: '0 auto', letterSpacing: '0.02em' }}>{t.heroDesc}</p>
          </section>

          {/* Main */}
          <main style={{ flex: 1, width: '100%', maxWidth: '72rem', margin: '0 auto', padding: '0 40px 64px' }}>
            <div className="card ghost-border" style={{ marginBottom: 32 }}>
              {/* Tabs */}
              <div style={{ padding: '0 32px', borderBottom: '1px solid var(--outline-variant)', display: 'flex', gap: 0, overflowX: 'auto' }}>
                {tabs.map(tab => (
                  <button key={tab.id} className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`} onClick={() => { setActiveTab(tab.id); setError(''); setSuccess(''); setOutput(''); }}>{tab.label}</button>
                ))}
              </div>

              <div style={{ padding: '32px' }} className="fade-in">
                {/* Toolbar */}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 24, alignItems: 'center' }}>
                  {activeTab === 'format' && (<><button className="btn btn-primary" onClick={handleFormat}>{t.format}</button><select value={indentSize} onChange={(e) => setIndentSize(Number(e.target.value))} style={{ padding: '8px 12px', background: 'var(--surface-high)', color: 'var(--text-primary)', border: 'none', fontFamily: 'var(--font-grotesk)', fontSize: 11, letterSpacing: '0.05em' }}><option value={2}>2 SPACES</option><option value={4}>4 SPACES</option><option value={8}>TAB (8)</option></select></>)}
                  {activeTab === 'minify' && <button className="btn btn-primary" onClick={handleMinify}>{t.minify}</button>}
                  {activeTab === 'validate' && <button className="btn btn-primary" onClick={handleValidate}>{t.validate}</button>}
                  {activeTab === 'escape' && (<><button className="btn btn-primary" onClick={handleEscape}>{t.escape}</button><button className="btn btn-secondary" onClick={handleUnescape}>{t.unescape}</button></>)}
                  <div style={{ flex: 1 }} />
                  <button className="btn btn-ghost" onClick={handleSample}>{t.sample}</button>
                  <label className="btn btn-ghost" style={{ cursor: 'pointer' }}>{icons.upload} {t.import_}<input type="file" accept=".json,.txt" onChange={handleFileUpload} style={{ display: 'none' }} /></label>
                  {(output || input) && (<><button className="btn btn-ghost" onClick={handleCopy}>{copied ? icons.check : icons.copy} {copied ? t.copied : t.copy}</button><button className="btn btn-ghost" onClick={handleDownload}>{icons.download} {t.export_}</button></>)}
                  {input && <button className="btn btn-ghost" onClick={clearAll}>{icons.trash}</button>}
                </div>

                {error && <div className="error-msg fade-in" style={{ marginBottom: 16 }}>{error}</div>}
                {success && <div className="success-msg fade-in" style={{ marginBottom: 16 }}>{success}</div>}

                {input && stats && activeTab !== 'diff' && (
                  <div style={{ display: 'flex', gap: 16, marginBottom: 16, fontSize: 11, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                    <span>{t.type}: <span className="badge">{stats.type}</span></span>
                    {stats.keys !== undefined && <span>{t.keys}: <strong style={{ color: 'var(--text-primary)' }}>{stats.keys}</strong></span>}
                    {stats.size !== undefined && <span>{t.size}: <strong style={{ color: 'var(--text-primary)' }}>{stats.size}B</strong></span>}
                    <span>{t.length}: <strong style={{ color: 'var(--text-primary)' }}>{input.length}</strong> {t.chars}</span>
                  </div>
                )}


                {/* Content Area */}
                {activeTab === 'diff' ? (
                  <div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, marginBottom: 24 }}>
                      <div><label style={{ fontSize: 10, fontWeight: 600, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, display: 'block' }}>{t.leftJson}</label><textarea className="json-input" value={diffLeft} onChange={(e) => setDiffLeft(e.target.value)} placeholder='{"key": "value"}' style={{ minHeight: 200 }} /></div>
                      <div><label style={{ fontSize: 10, fontWeight: 600, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, display: 'block' }}>{t.rightJson}</label><textarea className="json-input" value={diffRight} onChange={(e) => setDiffRight(e.target.value)} placeholder='{"key": "new value"}' style={{ minHeight: 200 }} /></div>
                    </div>
                    {diffLeft && diffRight && <JSONDiff left={diffLeft} right={diffRight} t={t} />}
                  </div>
                ) : (
                  <div style={{ display: 'grid', gridTemplateColumns: activeTab === 'tree' ? '1fr' : (output ? '1fr 1fr' : '1fr'), gap: 24 }}>
                    {activeTab !== 'tree' || !input ? (
                      <div><label style={{ fontSize: 10, fontWeight: 600, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, display: 'block' }}>{t.input}</label><textarea className="json-input" value={input} onChange={(e) => setInput(e.target.value)} placeholder={t.placeholder} spellCheck={false} /></div>
                    ) : null}
                    {activeTab === 'tree' && input ? (
                      <div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                          <label style={{ fontSize: 10, fontWeight: 600, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{t.treeView}</label>
                          <button className="btn btn-ghost" onClick={() => setInput('')} style={{ fontSize: 10, padding: '4px 10px' }}>{t.back}</button>
                        </div>
                        <div className="json-output" style={{ minHeight: 360 }}>
                          {(() => { try { return <TreeNode keyName={null} value={JSON.parse(input)} depth={0} />; } catch (e) { return <div className="error-msg">{e.message}</div>; } })()}
                        </div>
                      </div>
                    ) : output ? (
                      <div><label style={{ fontSize: 10, fontWeight: 600, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, display: 'block' }}>{t.output}</label><div className="json-output">{output}</div></div>
                    ) : null}
                  </div>
                )}
              </div>
            </div>

            {/* Features */}
            <section style={{ marginBottom: 64 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 2 }}>
                {t.features.map((f, i) => (
                  <div key={i} style={{ background: 'var(--surface-low)', padding: '32px', transition: 'background 300ms' }}>
                    <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: 16, fontWeight: 600, marginBottom: 8, color: 'var(--text-primary)' }}>{f.title}</h3>
                    <p style={{ fontSize: 12, fontFamily: 'var(--font-grotesk)', color: 'var(--text-secondary)', lineHeight: 1.6 }}>{f.desc}</p>
                  </div>
                ))}
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer style={{ padding: '40px', textAlign: 'center', background: 'var(--surface-low)' }}>
            <p style={{ fontSize: 11, fontFamily: 'var(--font-grotesk)', color: 'var(--text-tertiary)', letterSpacing: '0.05em', textTransform: 'uppercase' }}>{t.footer}</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
